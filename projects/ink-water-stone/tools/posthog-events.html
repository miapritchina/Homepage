<script>
// Analytics events for the guide (PostHog; autocapture already records clicks, pageviews and errors)
(function () {
  // look posthog up on every call: the loader's stub is replaced by the real library once it loads
  var ph = { capture: function (name, props) { if (window.posthog) window.posthog.capture(name, props); } };
  document.querySelectorAll('.tabb').forEach(function (b) {
    b.addEventListener('click', function () { ph.capture('tab_switched', { tab: b.dataset.tab }); });
  });
  document.addEventListener('change', function (e) {
    var cb = e.target.closest && e.target.closest('input[data-tick]');
    if (cb) ph.capture('step_ticked', { step: cb.dataset.tick, done: cb.checked });
  });
  var q = document.getElementById('q'), qt = null;
  if (q) q.addEventListener('input', function () {
    clearTimeout(qt);
    qt = setTimeout(function () {
      var term = q.value.trim();
      if (term) ph.capture('brush_searched', { query: term, results: document.querySelectorAll('#dgrid .dcard').length });
    }, 1200);
  });
  document.addEventListener('click', function (e) {
    var z = e.target.closest && e.target.closest('.zt');
    if (z) ph.capture('glossary_opened', { text: z.textContent });
    var im = e.target.closest && e.target.closest('img.zoomable');
    if (im) ph.capture('image_zoomed', { src: im.getAttribute('src'), alt: im.alt });
  }, true);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'progress' && d.done >= d.total) {
      try { if (localStorage.getItem('iws-offline-reported')) return; localStorage.setItem('iws-offline-reported', '1'); } catch (err) {}
      ph.capture('offline_ready', { files: d.total });
    }
  });
})();
</script>
